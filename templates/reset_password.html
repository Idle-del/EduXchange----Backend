<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f6f9;
        }

        .card{
            width:420px;
            margin:80px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#1B3A6B;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        .error{
            color:red;
            margin-top:15px;
        }

    </style>

</head>

<body>

<div class="card">

<h2>Reset Password</h2>

<p>Create a new password for your EduXchange account.</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="password"
name="password"
placeholder="New Password"
required>

<input
type="password"
name="confirm"
placeholder="Confirm Password"
required>

<button type="submit">
Reset Password
</button>

</form>

</div>

</body>
</html>
