<!DOCTYPE html>
<html>

<head>

<title>Password Updated</title>

<style>

body{

font-family:Arial;
background:#f4f6f9;
text-align:center;

}

.card{

width:450px;
margin:100px auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.08);

}

button{

padding:12px 24px;
background:#1B3A6B;
color:white;
border:none;
border-radius:8px;

}

</style>

</head>

<body>

<div class="card">

{% if success %}

<h2>Success 🎉</h2>

<p>{{ message }}</p>

<p>
You can now open the EduXchange app and sign in using your new password.
</p>

{% else %}

<h2>Invalid Link</h2>

<p>{{ message }}</p>

{% endif %}

</div>

</body>

</html>
